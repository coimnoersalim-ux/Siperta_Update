<div class="grid2" style="margin-top:1rem;">
  <div class="panel">
    <b style="font-size:.875rem">Distribusi Kelas Tanah</b> <span style="font-size:10px;color:#64748b;background:#f1f5f9;padding:2px 8px;border-radius:4px;">Berdasarkan Luas</span>
    <div class="chartbox" style="margin-top:1rem;"><canvas id="chDonut"></canvas></div>
    <div class="legend">
      <div style="background:#ecfdf5;border:1px solid #d1fae5;"><b style="color:#047857" id="pProd">0%</b><span style="color:#059669">Produktif</span></div>
      <div style="background:#fffbeb;border:1px solid #fef3c7;"><b style="color:#b45309" id="pNon">0%</b><span style="color:#d97706">Tidak Prod.</span></div>
      <div style="background:#eef2ff;border:1px solid #e0e7ff;"><b style="color:#4338ca" id="pPem">0%</b><span style="color:#4f46e5">Pemukiman</span></div>
    </div>
  </div>
  <div class="panel">
    <b style="font-size:.875rem">Status Kepemilikan</b> <span style="font-size:10px;color:#64748b;background:#f1f5f9;padding:2px 8px;border-radius:4px;">Berdasarkan Jumlah Bidang</span>
    <div class="chartbox" style="margin-top:1rem;"><canvas id="chStatus"></canvas></div>
  </div>
</div>

<div class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div><b style="font-size:.875rem">Perbandingan Luas per Blok</b><div style="font-size:10px;color:#64748b;">10 blok terluas</div></div>
    <button class="btn btn-green" style="font-size:.7rem;padding:.4rem .8rem;" onclick="document.querySelector('[data-page=rekap]').click()">Lihat Detail</button>
  </div>
  <div class="chartbox" style="height:16rem;margin-top:1rem;"><canvas id="chBar"></canvas></div>
</div>
